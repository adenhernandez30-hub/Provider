workflows:
  provider-samehadaku-media3-e2e:
    name: Provider v2 - Samehadaku + Media3 Playback E2E
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      java: 17
      groups:
        - emulatorwtf

    scripts:
      - name: Build Provider playback test APKs
        script: |
          set -euo pipefail
          ./gradlew :playback-e2e:assembleDebug :playback-e2e:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Run Media3 playback on emulator.wtf
        script: |
          set -euo pipefail
          mkdir -p results
          ew-cli \
            --app playback-e2e/build/outputs/apk/debug/playback-e2e-debug.apk \
            --test playback-e2e/build/outputs/apk/androidTest/debug/playback-e2e-debug-androidTest.apk \
            --environment-variables "SAMEHADAKU_E2E_EPISODE_URL=https://v2.samehadaku.how/one-piece-episode-1178/" \
            --outputs-dir results
        test_report: results/**/*.xml

    artifacts:
      - results/**
      - playback-e2e/build/outputs/apk/debug/*.apk
      - playback-e2e/build/outputs/apk/androidTest/debug/*.apk
