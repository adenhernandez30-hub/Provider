workflows:
  provider-samehadaku-e2e:
    name: Provider v2 - Samehadaku Real-Site E2E
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      java: 17

    scripts:
      - name: Run Samehadaku real-site E2E
        script: |
          set -euo pipefail
          export SAMEHADAKU_E2E_EPISODE_URL="https://v2.samehadaku.how/one-piece-episode-1178/"
          ./gradlew :provider-v2:testDebugUnitTest             --tests '*SamehadakuRealSiteE2ETest'             --stacktrace             --no-daemon
        test_report: provider-v2/build/test-results/testDebugUnitTest/**/*.xml

    artifacts:
      - provider-v2/build/reports/tests/testDebugUnitTest/**
      - provider-v2/build/test-results/testDebugUnitTest/**/*.xml
