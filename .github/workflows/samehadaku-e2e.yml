name: Samehadaku Real-Site E2E

on:
  workflow_dispatch:
    inputs:
      episode_url:
        description: "Samehadaku episode URL to test"
        required: true
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rewrite/provider-v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Samehadaku real-site E2E
        env:
          SAMEHADAKU_E2E_EPISODE_URL: ${{ inputs.episode_url }}
        run: gradle :provider-v2:testDebugUnitTest --tests '*SamehadakuRealSiteE2ETest' --stacktrace
