name: Provider Real-Site E2E

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run batch real-site E2E
        env:
          ANILAB_REAL_E2E: 'true'
          ANILAB_E2E_QUERY: 'One Piece'
          ANILAB_E2E_TIMEOUT_MS: '60000'
        run: ./gradlew :provider:test --tests com.kakaanime.provider.ProviderRealSiteE2ETest --stacktrace
