name: Migrate provider snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy provider snapshot
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --no-tags --depth 1 https://github.com/Aemeathhh90/vider.git "$tmp/vider"
          cd "$tmp/vider"
          git fetch --no-tags origin 2f25fe0cabac7f26bb560dfa30c09d5da9ee8de5
          git checkout --detach 2f25fe0cabac7f26bb560dfa30c09d5da9ee8de5
          cd - >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$tmp/vider/." .
          rm -rf "$tmp"

      - name: Commit migrated snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes."
            exit 0
          fi
          git commit -m "migrate: provider snapshot from vider"
          git push origin HEAD:main
